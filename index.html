<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>MY ASSET</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="app">


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo" id="headerTitle">
        MY ASSET
    </div>


    <div class="date-wrap">

        <span id="loadStatus" class="load-status"></span>

        <span id="selectedDate"></span>

        <input type="date" id="datePicker">

    </div>

</header>



<!-- =========================
     HOME
========================= -->

<main id="homePage" class="page active-page">

    <section class="net-worth-stack" id="netWorthStack">

        <div class="net-worth-card">

            <div class="small-title">
                나의 순자산
            </div>

            <div class="net-worth">
                ₩
                <span id="netWorth">0</span>
            </div>

        </div>


        <div class="net-worth-card secondary-card">

            <div class="small-title">
                부동산 제외 순자산
            </div>

            <div class="net-worth secondary">
                ₩
                <span id="netWorthExcludingRealEstate">0</span>
            </div>

        </div>

    </section>


    <div class="stack-dots" id="stackDots">
        <span class="dot active"></span>
        <span class="dot"></span>
    </div>


    <section class="section">

        <div class="section-title">

            <span>자산</span>

            <span class="total">
                ₩
                <span id="assetTotal">0</span>
            </span>

        </div>


        <div id="homeAssets" class="category-card"></div>


        <div class="section-title debt-section-title">

            <span>부채</span>

            <span class="total">
                ₩
                <span id="debtTotal">0</span>
            </span>

        </div>


        <div id="homeDebts" class="category-card"></div>

    </section>

</main>



<!-- =========================
     INPUT
========================= -->

<main id="inputPage" class="page">

    <div id="inputTree"></div>


    <button type="button" class="save-btn" id="saveButton">
        저장하기
    </button>


    <div id="saveStatus" class="save-status"></div>

</main>



<!-- =========================
     ANALYSIS
========================= -->

<main id="analysisPage" class="page">

    <div class="analysis-page">


        <section class="analysis-card">

            <div class="analysis-title">
                <div>순자산 추이</div>
            </div>

            <div class="chart-container" id="netWorthChart"></div>

        </section>



        <section class="analysis-card">

            <div class="analysis-title">
                <div>자산 · 부채 추이</div>
            </div>

            <div class="chart-legend">

                <div class="legend-item">
                    <span class="legend-dot asset-line"></span>
                    <span>자산(부동산 제외)</span>
                </div>

                <div class="legend-item">
                    <span class="legend-dot debt-line"></span>
                    <span>부채</span>
                </div>

            </div>

            <div class="chart-container" id="assetDebtChart"></div>

        </section>



        <section class="analysis-card">

            <div class="analysis-title">
                <div>투자자산 변동</div>
            </div>

            <div class="chart-legend">

                <div class="legend-item">
                    <span class="legend-dot stock-line"></span>
                    <span>주식</span>
                </div>

                <div class="legend-item">
                    <span class="legend-dot coin-line"></span>
                    <span>비트코인</span>
                </div>

            </div>

            <div class="chart-container" id="investmentChart"></div>

        </section>


    </div>

</main>



<!-- =========================
     DETAIL
========================= -->

<main id="detailPage" class="page">

    <div class="empty-page">

        <div class="empty-icon">☷</div>

        <h2>상세</h2>

        <p>
            날짜별 자산 내역을<br>
            확인할 수 있습니다.
        </p>

    </div>

</main>



<!-- =========================
     SETTINGS
========================= -->

<main id="settingsPage" class="page">

    <div class="empty-page">

        <div class="empty-icon">⚙</div>

        <h2>설정</h2>

        <p>MY ASSET 설정</p>

    </div>

</main>



<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">

    <button class="nav-item active" data-page="home">

        <div class="nav-icon">⌂</div>

        <span>홈</span>

    </button>


    <button class="nav-item" data-page="input">

        <div class="nav-icon">＋</div>

        <span>입력</span>

    </button>


    <button class="nav-item" data-page="analysis">

        <div class="nav-icon">◔</div>

        <span>분석</span>

    </button>


    <button class="nav-item" data-page="detail">

        <div class="nav-icon">☷</div>

        <span>상세</span>

    </button>


    <button class="nav-item" data-page="settings">

        <div class="nav-icon">⚙</div>

        <span>설정</span>

    </button>

</nav>


</div>


<script src="js/api.js"></script>
<script src="js/script.js"></script>

</body>

</html>
