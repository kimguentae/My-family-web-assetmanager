<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>MY ASSET</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="app">


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo" id="headerTitle">
        MY ASSET
    </div>


    <div class="date-wrap">

        <span id="loadStatus" class="load-status"></span>

        <span id="selectedDate"></span>

        <input type="date" id="datePicker">

    </div>

</header>



<!-- =========================
     HOME
========================= -->

<main id="homePage" class="page active-page">

    <section class="net-worth-stack" id="netWorthStack">

        <div class="net-worth-card">

            <div class="small-title">
                나의 순자산
            </div>

            <div class="net-worth">
                ₩
                <span id="netWorth">0</span>
            </div>

        </div>


        <div class="net-worth-card secondary-card">

            <div class="small-title">
                부동산 제외 순자산
            </div>

            <div class="net-worth secondary">
                ₩
                <span id="netWorthExcludingRealEstate">0</span>
            </div>

        </div>

    </section>


    <div class="stack-dots" id="stackDots">
        <span class="dot active"></span>
        <span class="dot"></span>
    </div>



    <div class="home-group" id="homeAssetGroup">

        <div class="home-group-header" data-group="asset">

            <div class="home-group-title">
                자산
            </div>

            <div class="home-group-total">

                ₩
                <span id="assetTotal">0</span>

                <span class="arrow">›</span>

            </div>

        </div>


        <div class="home-group-body" id="homeAssets"></div>

    </div>



    <div class="home-group" id="homeDebtGroup">

        <div class="home-group-header" data-group="debt">

            <div class="home-group-title">
                부채
            </div>

            <div class="home-group-total">

                ₩
                <span id="debtTotal">0</span>

                <span class="arrow">›</span>

            </div>

        </div>


        <div class="home-group-body" id="homeDebts"></div>

    </div>

</main>



<!-- =========================
     INPUT
========================= -->

<main id="inputPage" class="page">

    <div id="inputTree"></div>


    <button type="button" class="save-btn" id="saveButton">
        저장하기
    </button>


    <div id="saveStatus" class="save-status"></div>

</main>



<!-- =========================
     ANALYSIS
========================= -->

<main id="analysisPage" class="page">

    <div class="analysis-page" id="analysisContainer"></div>

</main>



<!-- =========================
     INVESTMENT
========================= -->

<main id="detailPage" class="page">

    <div id="investmentContainer"></div>

</main>



<!-- =========================
     SETTINGS
========================= -->

<main id="settingsPage" class="page">

    <div class="settings-page">

        <section class="settings-card collapsible">
            <div class="settings-card-header">
                <div>
                    <div class="settings-title">목표 금액</div>
                    <div class="settings-desc">목표를 입력하면 분석탭의 진행률에 반영됩니다.</div>
                </div>
                <span class="settings-card-arrow">›</span>
            </div>

            <div class="settings-card-body">
                <div id="goalSettingsList"></div>
                <button type="button" class="save-btn" id="goalSaveButton" style="margin-top:12px;">
                    목표 저장
                </button>
            </div>
        </section>


        <section class="settings-card collapsible">
            <div class="settings-card-header">
                <div>
                    <div class="settings-title">분석 화면 설정</div>
                    <div class="settings-desc">항목을 켜고 끄거나 순서를 변경할 수 있습니다.</div>
                </div>
                <span class="settings-card-arrow">›</span>
            </div>

            <div class="settings-card-body">
                <div id="analysisSettingsList"></div>
            </div>
        </section>


        <section class="settings-card">
            <div class="settings-title">데이터 초기화</div>
            <div class="settings-desc">
                로컬에 저장된 트리/입력값을 초기화합니다.
                (Supabase 서버 데이터는 삭제되지 않습니다)
            </div>
            <button type="button" class="danger-btn" id="resetLocalButton">
                로컬 데이터 초기화
            </button>
        </section>

    </div>

</main>



<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">

    <button class="nav-item active" data-page="home">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.5L12 3l9 7.5"/>
                <path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>
            </svg>
        </div>
        <span>홈</span>
    </button>


    <button class="nav-item" data-page="input">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 20h16"/>
                <path d="M12 4v12"/>
                <path d="M6 10h12"/>
            </svg>
        </div>
        <span>입력</span>
    </button>


    <button class="nav-item" data-page="analysis">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19V5"/>
                <path d="M4 19h16"/>
                <path d="M7 15l3.5-4 3 2.5L18 8"/>
            </svg>
        </div>
        <span>분석</span>
    </button>


    <button class="nav-item" data-page="detail">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v20"/>
                <path d="M17 6.5c0-1.7-1.9-3-4.5-3S8 4.8 8 6.5s1.9 3 4.5 3 4.5 1.3 4.5 3-1.9 3-4.5 3-4.5-1.3-4.5-3"/>
            </svg>
        </div>
        <span>투자자산</span>
    </button>


    <button class="nav-item" data-page="settings">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
            </svg>
        </div>
        <span>설정</span>
    </button>

</nav>


</div>



<!-- =========================
     CUSTOM MODAL
========================= -->

<div class="modal-backdrop" id="modalBackdrop">

    <div class="modal-sheet" id="modalSheet">

        <div class="modal-handle"></div>

        <div class="modal-title" id="modalTitle"></div>

        <div class="modal-desc" id="modalDesc"></div>

        <input
            type="text"
            class="modal-input"
            id="modalInput"
            autocomplete="off"
        >

        <div class="modal-actions" id="modalActions">
            <button type="button" class="modal-btn cancel" id="modalCancel">취소</button>
            <button type="button" class="modal-btn confirm" id="modalConfirm">확인</button>
        </div>

    </div>

</div>



<!-- =========================
     CONTEXT MENU
========================= -->

<div class="context-menu" id="contextMenu">

    <button type="button" data-action="edit">이름 수정</button>
    <button type="button" data-action="add">하위 추가</button>
    <button type="button" data-action="delete" class="danger">삭제</button>

</div>



<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 앱 로직 -->
<script src="js/api.js"></script>

</body>

</html>
